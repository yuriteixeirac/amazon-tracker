spring.application.name=AmazonScraper

# Relational Database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/price_tracker}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Spring Security
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-time=${JWT_EXPIRATION_TIME:1209600000}

# Queue System
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
app.rabbitmq.track-product-queue=${APP_RABBITMQ_TRACK_PRODUCT_QUEUE:track_product}

# Product tracking scheduler
app.product-tracking.scheduler-enabled=${APP_PRODUCT_TRACKING_SCHEDULER_ENABLED:true}
app.product-tracking.fixed-delay-ms=${APP_PRODUCT_TRACKING_FIXED_DELAY_MS:1800000}
app.product-tracking.initial-delay-ms=${APP_PRODUCT_TRACKING_INITIAL_DELAY_MS:60000}

# Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
